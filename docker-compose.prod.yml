version: "3.9"

services:
  # ============================================================
  # PostgreSQL — Production Database (Go-Vote)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: govote_db_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: Go-Vote
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/internal/migration:/docker-entrypoint-initdb.d:ro
    networks:
      - govote_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d Go-Vote"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports exposed — only accessible internally

  # ============================================================
  # Backend — Golang API (Production, multi-stage build)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: govote_backend_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - govote_internal_net
      - govote_external_net

  # ============================================================
  # Frontend — Nginx serving React build
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: govote_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - govote_external_net

volumes:
  postgres_prod_data:
    name: govote_postgres_prod
    driver: local
    driver_opts:
      type: none
      device: /opt/govote/postgres_data
      o: bind
  uploads_prod:
    name: govote_uploads_prod

networks:
  govote_internal_net:
    name: govote_internal
    driver: bridge
    internal: true
  govote_external_net:
    name: govote_external
    driver: bridge
