version: "3.9"

services:
  # ============================================================
  # PostgreSQL — Production Database (Go-Vote)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: voting_database
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/internal/migration:/docker-entrypoint-initdb.d:ro
    networks:
      - govote_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports exposed — only accessible internally

  # ============================================================
  # Backend — Golang API (Production, multi-stage build)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: voting_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      DB_HOST: db
    ports:
      - "8085:8085"
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - govote_internal_net
      - govote_external_net

  # ============================================================
  # Frontend — Nginx serving React build
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: "${VITE_API_URL:-}"
    container_name: voting_frontend
    restart: always
    ports:
      - "5175:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - govote_external_net

volumes:
  postgres_prod_data:
    name: voting_postgres_data
  uploads_prod:
    name: voting_uploads_data

networks:
  govote_internal_net:
    name: govote_internal
    driver: bridge
    internal: true
  govote_external_net:
    name: govote_external
    driver: bridge
