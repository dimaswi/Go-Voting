version: "3.9"

services:
  # ============================================================
  # PostgreSQL — Development Database (Go-Vote)
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: govote_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: Go-Vote
      POSTGRES_USER: govote
      POSTGRES_PASSWORD: govote_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/internal/migration:/docker-entrypoint-initdb.d:ro
    networks:
      - govote_dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govote -d Go-Vote"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # pgAdmin — DB GUI (Development Only)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: govote_pgadmin_dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@govote.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_password
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - govote_dev_net

  # ============================================================
  # Backend — Golang API (Development with hot reload)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: govote_backend_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - govote_dev_net

  # ============================================================
  # Frontend — React + Vite Dev Server
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: govote_frontend_dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules_dev:/app/node_modules
    depends_on:
      - backend
    networks:
      - govote_dev_net

volumes:
  postgres_dev_data:
    name: govote_postgres_dev
  pgadmin_dev_data:
    name: govote_pgadmin_dev
  go_mod_cache:
    name: govote_go_mod_cache
  node_modules_dev:
    name: govote_node_modules_dev

networks:
  govote_dev_net:
    name: govote_dev_network
    driver: bridge
